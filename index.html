<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomorrow in Hamar</title>
<link rel="stylesheet" href="style.css">
<script src="weather.js" defer></script>
</head>
<body><main>
<div class="brand">HAMAR / WEATHER</div>
<header><div><h1>A look at tomorrow.</h1><p>Hamar, Norway · <span id="date">Tomorrow</span></p></div><button id="refresh">↻ Refresh</button></header>
<p id="status" role="status" aria-live="polite">Loading tomorrow’s forecast…</p>
<section id="forecast" hidden aria-label="Tomorrow's forecast">
<div class="hero"><div><div class="label">Tomorrow at midday</div><div class="temperature" id="temperature"></div><div class="condition" id="condition"></div></div><div class="symbol" id="symbol" aria-hidden="true"></div></div>
<div class="metrics"><div class="metric"><div class="label">Low / High</div><strong id="range"></strong></div><div class="metric"><div class="label">Rain · daily total</div><strong id="rain"></strong></div><div class="metric"><div class="label">Wind · midday</div><strong id="wind"></strong></div></div>
<h2>Through the day</h2><div class="hours" id="hours"></div>
</section>
<footer><span>Forecast by <a href="https://www.met.no/">MET Norway</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></span><span id="updated">Times in Europe/Oslo</span></footer>
</main></body></html>
