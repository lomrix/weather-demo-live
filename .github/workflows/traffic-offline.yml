name: Traffic offline verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic-offline:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify saved traffic data offline
        run: python scripts/verify_traffic.py
      - name: Verify saved route coverage offline
        run: python scripts/verify_route_coverage.py
      - name: Verify bounded bus collection offline
        run: python scripts/verify_bus_collection.py
