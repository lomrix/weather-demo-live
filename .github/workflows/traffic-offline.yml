name: Hamar offline readiness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic-offline:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run frozen offline readiness evaluation
        run: python -B -m harness.run_readiness --output out/ci-readiness
      - name: Preserve complete readiness evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: readiness-${{ matrix.os }}
          path: out/ci-readiness
          if-no-files-found: warn
          retention-days: 14
